name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-amd64:
    name: Package Linux x86-64 release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-4-dev libwebp-dev zip

      - name: Verify tag and application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          version="$(tr -d '\r\n' < VERSION)"
          test "$expected" = "$version"

      - name: Build release binaries
        run: ./build.sh

      - name: Assemble ready-to-install Linux packages
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Generate and verify release checksums
        run: |
          set -euo pipefail
          (cd release && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          (cd release && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.zip release/*.tar.gz release/SHA256SUMS.txt \
            --title "scompress ${GITHUB_REF_NAME}" \
            --generate-notes
